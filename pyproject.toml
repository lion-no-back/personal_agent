[project]
name = "personalagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10",
    "lark-oapi>=1.5.3",
    "markdownify>=1.2.2",
    "mcp>=1.27.0",
    "openai>=2.32.0",
    "python-dotenv>=1.0.0",
    "qrcode>=8.2",
    "requests>=2.33.1",
    "rich>=13.0",
]

[project.optional-dependencies]
# 安装后可在首次配置向导中显示终端二维码（纯 Python，无需 Pillow）
# 安装方式：uv add qrcode  或  pip install qrcode
setup = [
    "qrcode>=7.0",
]

# ──────────────────────────────────────────────────────────────
# Workflow 专用依赖组
# 首次运行对应 workflow 时会自动触发安装，无需手动操作。
# 手动安装：uv sync --group costupdate-saihu
# ──────────────────────────────────────────────────────────────
[dependency-groups]
costupdate-saihu = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "ddddocr>=1.5",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pycryptodome>=3.20",
    "python-calamine>=0.2",
    "tqdm>=4.66",
]
