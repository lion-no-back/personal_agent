[project]
name = "personalagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10",
    "ddgs>=9.14.3",
    "dingtalk-stream>=0.24.3",
    "jsonschema>=4.20",
    "lark-oapi>=1.5.3",
    "markdownify>=1.2.2",
    "mcp>=1.27.0",
    "openai>=2.32.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "qrcode>=8.2",
    "requests>=2.33.1",
    "rich>=13.0",
]

[project.optional-dependencies]
# 安装后可在首次配置向导中显示终端二维码（纯 Python，无需 Pillow）
# 安装方式：uv add qrcode  或  pip install qrcode
setup = [
    "qrcode>=7.0",
]

# ──────────────────────────────────────────────────────────────
# Workflow 专用依赖组
# 首次运行对应 workflow 时会自动触发安装，无需手动操作。
# 手动安装：uv sync --group costupdate-saihu
# ──────────────────────────────────────────────────────────────
[dependency-groups]
zxwarn-mabang = [
    "openpyxl>=3.1",
    "pandas>=2.0",
    "python-calamine>=0.2",
]

costupdate-saihu = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "ddddocr>=1.5",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pycryptodome>=3.20",
    "python-calamine>=0.2",
    "tqdm>=4.66",
]

rmorder-mabang = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "tqdm>=4.66",
]

# 所需 Chromium 二进制，由 runner 首次运行时下载到 rankbb_amazon/chromium/（PLAYWRIGHT_BROWSERS_PATH 重定向），
rankbb-amazon = [
    "scrapling[all]>=0.4.9",
]

# cloakbrowser 首次发送【评论配置】时由 runner 自动安装；Chromium 二进制由 cloakbrowser 下载到 fxreview_amazon/chromium/
# 锁定 ==0.4.0（隐身依赖锁版本，避免上游发版悄改有头窗口行为；详见 runner.py / session.py 注释）
fxreview-amazon = [
    "cloakbrowser==0.4.0",
]

asinfc-h10 = [
    "DrissionPage>=4.1.0",
    "Pillow>=10.0.0",
]

knowledge = [
    "opendataloader-pdf",
    "markitdown",
    "unstructured[pdf,image]",
    "sqlite-vec==0.1.9",
    "watchdog",
    "huggingface-hub",
    "paddlepaddle",
    "unstructured-paddleocr",
]
