name: Mirror to Organization

on:
  push:
    branches:
      - '**'
  delete:
  create:

jobs:
  mirror:
    if: github.repository == 'lion-no-back/personal_agent'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to organization repo
        env:
          TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
        run: |
          test -n "$TOKEN" || (echo "ORG_REPO_TOKEN is empty" && exit 1)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git config --local --unset-all http.https://github.com/.extraheader || true # 必加：清除默认 Git 认证头 (Extraheader)

          git remote add org "https://x-access-token:${TOKEN}@github.com/LXE123/feishu_oc_agent.git"

          git ls-remote org

          git push org --all --force
          git push org --tags --force